span aria-hidden=\"true\" class=\"event-symbol\">⌖</span><span>Magnum &amp; Siruseri</span></span></div>\n<div class=\"hero-main\"><div class=\"eyebrow\">AI FRIDAYS · SEASON 3 · SUPER SENIOR LEADERSHIP EDITION</div><h1>From AI Fluency <em>to Executive Impact</em><small>Leadership Challenge &amp; Decision Workbook</small></h1><p class=\"hero-sub\">Five practical leadership challenges plus one open-ended leadership challenge. Apply your experience, make clear decisions and recommend workable improvements. Use approved AI tools actively to research, reason, draft and verify your work. The business solution itself can use any suitable process or technology; an AI-based solution is not required.</p>\n<div class=\"stats\"><span class=\"stat\"><b>5</b> core problem statements</span><span class=\"stat\"><b>1</b> open innovation challenge</span><span class=\"stat\"><b>10</b> core outputs · PS 06 flexible</span></div>\n<div class=\"hero-note\">Super senior leaders across delivery management, software engineering, pre-sales, delivery excellence and customer management. Strong leadership judgment matters more than coding or technical architecture. The fifth challenge focuses on prioritizing delivery commitments and shared resources across multiple customer programs.</div></div>","notice":"<aside class=\"notice\" role=\"note\"><span class=\"notice-icon\">📝</span><div><h2>Reminder — save prompts used across AI tools</h2><p>Maintain a shared prompt record of AI tools actually used. For each case, capture an initial prompt, useful follow-ups, a check or correction, relevant output, and how team judgment improved the final recommendation. Everyone should participate in AI-assisted work. Use approved tools only; do not include sensitive or confidential information.</p></div></aside>","noticeInner":"<span class=\"notice-icon\">📝</span><div><h2>Reminder — save prompts used across AI tools</h2><p>Maintain a shared prompt record of AI tools actually used. For each case, capture an initial prompt, useful follow-ups, a check or correction, relevant output, and how team judgment improved the final recommendation. Everyone should participate in AI-assisted work. Use approved tools only; do not include sensitive or confidential information.</p></div>","footer":"<footer class=\"foot\"><strong>AI Fridays · Season 3 · Super Senior Leadership Edition</strong><p>Decision quality, accountable leadership and practical AI fluency. All scenario values are illustrative exercise assumptions.</p><a href=\"#top\" style=\"color:#8cf0dd\">↑ Back to top</a></footer>","footerInner":"<strong>AI Fridays · Season 3 · Super Senior Leadership Edition</strong><p>Decision quality, accountable leadership and practical AI fluency. All scenario values are illustrative exercise assumptions.</p><a href=\"#top\" style=\"color:#8cf0dd\">↑ Back to top</a>","rawsections":{"submit":{"tag":"section","className":"panel submission-spotlight","innerHTML":"<div class=\"eyebrow section-label\">START HERE · FINAL TEAM SUBMISSION</div><div class=\"section-heading-app\"><span aria-hidden=\"true\" class=\"icon3d gold\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M8 4h9l3 3v13H5V4h3 M9 4V2h6v2 M8 13l3 3 5-6\"></path></svg></span><h2 class=\"section-title\">One integrated executive decision pack</h2></div><p>Submit one easy-to-navigate folder, deck or document set. For PS 01–05, provide two consolidated outputs per case—a decision brief and an action plan. For open-ended PS 06, each team chooses the number and type of deliverables that best suit its selected leadership challenge. Simple tables, slides and process sketches are welcome; coding and detailed architecture are not required.</p><div class=\"event-instructions\"><strong>Event handover details — confirm with your facilitator</strong><div class=\"handover-grid\"><div><b>Submission destination: </b>To be confirmed by the event team.</div><div><b>Submission deadline: </b>To be confirmed by the event team.</div><div><b>Team name / file naming convention: </b>To be confirmed by the event team.</div><div><b>Facilitator / support contact: </b>To be confirmed by the event team.</div></div></div><div class=\"final-check\"><label>All six problem statements are covered (PS 01–06).</label><label> PS 01–05 each include their two consolidated deliverables; PS 06 includes the deliverable(s) chosen by the team to suit its challenge.</label><label>Illustrative evidence and key assumptions are clearly labelled.</label><label>The recommended approach, its rationale, benefits, costs and key risks are clearly explained for each challenge.</label><label>Key actions have owners and checkpoints; major success measures show baseline, proposed target, review date and accountable owner.</label><label>Every team member has used an approved AI tool; the shared prompt record shows an initial prompt, meaningful refinement, validation/correction and improvement.</label><label>A three-minute leadership summary covers key decisions, expected value and lessons; it does not attempt to present all six cases in detail.</label><label> PS 06 addresses a distinct leadership challenge, without repeating the core cases; its team-selected deliverable(s) clearly show the proposed improvement and expected value.</label><label>All real/confidential/customer/employee information has been excluded.</label></div><p class=\"small-note\">Recommended front page: decisions requested, expected outcomes, key risks, next 90 days and evidence quality. Prepare a three-minute executive summary highlighting the most important decisions, value and learning—not a rushed walkthrough of all six cases. The jury may select cases for deeper discussion. An index to the two outputs for PS 01–05 and the team-selected PS 06 materials is useful.</p>"},"objectives":{"tag":"section","className":"panel","innerHTML":"<div class=\"eyebrow section-label\">01 · WHY THIS EDITION</div><div class=\"section-heading-app\"><span aria-hidden=\"true\" class=\"icon3d\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18 M12 11v5 M12 7h.01\"></path></svg></span><h2 class=\"section-title\">Designed for executive thinking, not report generation</h2></div><div class=\"intro-grid\"><div><p>This edition focuses on five realistic leadership problems plus one open-ended leadership challenge. Teams use the starting facts, make practical assumptions and recommend a suitable course of action. PS 01–05 each require two concise outputs; for PS 06, the team chooses the deliverable(s) that best fit its own challenge.</p><p>Use approved AI tools actively to understand the challenges, develop recommendations, test assumptions and improve your outputs. Every participant should work directly with AI tools. The proposed business solutions are technology-neutral: process improvement, governance, analytics, automation, AI or other appropriate choices are acceptable. No AI-based solution, prototype, coding or detailed technical architecture is required.</p><div class=\"facts\"><span>Cross-functional</span><span>Evidence-driven</span><span>Decision-ready</span><span>Responsible AI</span><span>Reuse-oriented</span></div></div><div><div class=\"goals\"><div class=\"goal\"><b>01</b> Build AI fluency</div><div class=\"goal\"><b>02</b> Hands-on problem solving</div><div class=\"goal\"><b>03</b> Confidence &amp; comfort</div><div class=\"goal\"><b>04</b> Beyond a single AI tool</div><div class=\"goal\"><b>05</b> Collaborative delivery</div><div class=\"goal\"><b>06</b> Lead by example</div><div class=\"goal\" style=\"grid-column:1/-1\"><b>07</b> Ideas to measurable impact and reusable assets</div></div><p class=\"small-note\">Aligned to the seven goals presented in the Super Senior AI Fridays objective-setting material.</p></div></div>"},"rules":{"tag":"section","className":"panel","innerHTML":"<div class=\"eyebrow section-label\">02 · OPERATING PRINCIPLES</div><div class=\"section-heading-app\"><span aria-hidden=\"true\" class=\"icon3d\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 5h7v7H4z M14 5h7v7h-7z M9 16h7v5H9z M7 12v2h10v2\"></path></svg></span><h2 class=\"section-title\">How to work through the challenges</h2></div><div class=\"track-grid\"><div class=\"track\"><b>Five core cases + an open-ended challenge</b><p>Teams are expected to address PS 01–05 and the open-ended PS 06. Assign an owner and a reviewer for each case, work in parallel where useful, and consolidate decisions together. Each participant should use approved AI tools directly rather than leaving all AI work to one person.</p></div><div class=\"track\"><b>Only synthetic inputs</b><p>Preserve the supplied case facts. Use no real employee, customer, contract, pricing or confidential information. Clearly distinguish case facts, added assumptions and AI-generated example records; synthetic examples help test reasoning but do not prove real outcomes.</p></div><div class=\"track\"><b>Two core outputs · PS 06 flexible</b><p>For PS 01–05, create a short decision brief and action plan for each case. For PS 06, decide what deliverable(s) best demonstrate your chosen leadership improvement. Simple tables or visuals are fine; detailed technical documents are not needed.</p></div><div class=\"track\"><b>Leaders own the decision</b><p>Use approved AI tools to research, challenge, draft and review. Leaders retain responsibility for assumptions and decisions; recommended business solutions can use any appropriate process or technology. No AI-based implementation or prototype is compulsory.</p></div><div class=\"track\"><b>Explain your recommendation</b><p>Recommend a practical approach and explain the key reasons, benefits, costs and risks behind your choice.</p></div><div class=\"track\"><b>Check and improve</b><p>Use AI to challenge assumptions, identify weak evidence and improve recommendations. Include an initial prompt, a substantive refinement, a validation or correction, and the improvement made in the team prompt record.</p></div></div><div class=\"workbook-guidance-strip\">For important success measures in each case, show the starting position, proposed target, accountable owner and review date. Targets are proposals, not achieved results. Keep analysis proportionate to the five-hour workshop—these are elements within the two PS 01–05 outputs or the team-selected PS 06 deliverable(s), not additional mandatory submissions.</div>"},"choose":{"tag":"section","className":"panel","innerHTML":"<div class=\"eyebrow section-label\">03 · CHOOSE / NAVIGATE</div><div class=\"section-heading-app\"><span aria-hidden=\"true\" class=\"icon3d\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z\"></path></svg></span><h2 class=\"section-title\">Five leadership problem statements + one open challenge</h2></div><p class=\"choose-intro\">Click a box to see its business situation, transformation requirement, two core-case deliverables and team-selected PS 06 outputs and useful decision checks. All five core challenges are included; the open challenge is also included.</p><div class=\"case-grid\"><a class=\"navcase\" href=\"#ps1\"><div class=\"navcase-top\"><span class=\"case-no\">01</span><span class=\"domain\">DELIVERY MANAGEMENT · SOFTWARE &amp; SERVICES</span></div><div class=\"navcase-icon\">📉</div><h3>Application Release Recovery, Service Stability &amp; Margin Protection</h3><p>Recover a delayed software release while protecting live service quality, customer confidence and delivery economics.</p><span class=\"go\">View detailed challenge <span aria-hidden=\"true\">↗</span></span></a><a class=\"navcase\" href=\"#ps2\"><div class=\"navcase-top\"><span class=\"case-no\">02</span><span class=\"domain\">PRE-SALES · DIGITAL ENGINEERING</span></div><div class=\"navcase-icon\">🧭</div><h3>Digital Product Modernization Pursuit: Win Strategy &amp; Deal Economics</h3><p>Shape a competitive application-modernization proposal that a delivery team can actually execute.</p><span class=\"go\">View detailed challenge <span aria-hidden=\"true\">↗</span></span></a><a class=\"navcase\" href=\"#ps3\"><div class=\"navcase-top\"><span class=\"case-no\">03</span><span class=\"domain\">DELIVERY EXCELLENCE · ENGINEERING &amp; OPERATIONS</span></div><div class=\"navcase-icon\">🛡️</div><h3>Software Quality, Engagement Health &amp; Delivery Assurance</h3><p>Create practical leadership oversight across software engineering, application support and service delivery.</p><span class=\"go\">View detailed challenge <span aria-hidden=\"true\">↗</span></span></a><a class=\"navcase\" href=\"#ps4\"><div class=\"navcase-top\"><span class=\"case-no\">04</span><span class=\"domain\">CUSTOMER MANAGEMENT · PRODUCT &amp; SERVICES</span></div><div class=\"navcase-icon\">🤝</div><h3>Digital Customer Trust Recovery, Product Value &amp; Renewal Growth</h3><p>Connect application outcomes and service reliability to a credible customer recovery and renewal strategy.</p><span class=\"go\">View detailed challenge <span aria-hidden=\"true\">↗</span></span></a><a class=\"navcase\" href=\"#ps5\"><div class=\"navcase-top\"><span class=\"case-no\">05</span><span class=\"domain\">DELIVERY MANAGEMENT · PORTFOLIO EXECUTION</span></div>\n<div class=\"navcase-icon\">📊</div><h3>Multi-Program Delivery Predictability &amp; Resource Prioritization</h3>\n<p>Improve delivery reliability across competing customer programs by balancing capacity, dependencies, scope and commitments.</p>\n<span class=\"go\">View detailed challenge <span aria-hidden=\"true\">↗</span></span>\n</a><a class=\"navcase bonus-card\" href=\"#open\"><div class=\"navcase-top\"><span class=\"case-no\">06</span><span class=\"domain\">OPEN INNOVATION</span></div><div class=\"navcase-icon\">💡</div><h3>Your Own Leadership Improvement Challenge</h3><p>Choose a leadership concern and outline a practical improvement using an approach of your choice.</p><span class=\"go\">View open-ended challenge ↗</span></a></div>"}},"submitBefore":"<div class=\"eyebrow section-label\">START HERE · FINAL TEAM SUBMISSION</div><div class=\"section-heading-app\"><span aria-hidden=\"true\" class=\"icon3d gold\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M8 4h9l3 3v13H5V4h3 M9 4V2h6v2 M8 13l3 3 5-6\"></path></svg></span><h2 class=\"section-title\">One integrated executive decision pack</h2></div><p>Submit one easy-to-navigate folder, deck or document set. For PS 01–05, provide two consolidated outputs per case—a decision brief and an action plan. For open-ended PS 06, each team chooses the number and type of deliverables that best suit its selected leadership challenge. Simple tables, slides and process sketches are welcome; coding and detailed architecture are not required.</p><div class=\"event-instructions\"><strong>Event handover details — confirm with your facilitator</strong><div class=\"handover-grid\"><div><b>Submission destination: </b>To be confirmed by the event team.</div><div><b>Submission deadline: </b>To be confirmed by the event team.</div><div><b>Team name / file naming convention: </b>To be confirmed by the event team.</div><div><b>Facilitator / support contact: </b>To be confirmed by the event team.</div></div></div>","submitAfter":"<p class=\"small-note\">Recommended front page: decisions requested, expected outcomes, key risks, next 90 days and evidence quality. Prepare a three-minute executive summary highlighting the most important decisions, value and learning—not a rushed walkthrough of all six cases. The jury may select cases for deeper discussion. An index to the two outputs for PS 01–05 and the team-selected PS 06 materials is useful.</p>","checks":["All six problem statements are covered (PS 01–06).","PS 01–05 each include their two consolidated deliverables; PS 06 includes the deliverable(s) chosen by the team to suit its challenge.","Illustrative evidence and key assumptions are clearly labelled.","The recommended approach, its rationale, benefits, costs and key risks are clearly explained for each challenge.","Key actions have owners and checkpoints; major success measures show baseline, proposed target, review date and accountable owner.","Every team member has used an approved AI tool; the shared prompt record shows an initial prompt, meaningful refinement, validation/correction and improvement.","A three-minute leadership summary covers key decisions, expected value and lessons; it does not attempt to present all six cases in detail.","PS 06 addresses a distinct leadership challenge, without repeating the core cases; its team-selected deliverable(s) clearly show the proposed improvement and expected value.","All real/confidential/customer/employee information has been excluded."],"chooseIntro":"<div class=\"eyebrow section-label\">03 · EXPLORE THE PROBLEM STATEMENTS</div><h2 class=\"section-title\">Five leadership problem statements + one open challenge</h2><p class=\"choose-intro\">Explore each business situation, transformation requirement, suggested evidence and decision checks. PS 01–05 have two fixed deliverables each; PS 06 is open-ended, with deliverable(s) chosen by the team. All six statements are expected: PS 01–05 earn up to 100 core marks, and PS 06 offers up to 30 additional bonus marks for a distinct leadership improvement.</p>","cards":[{"href":"#ps1","number":"01","domain":"DELIVERY MANAGEMENT · SOFTWARE & SERVICES","title":"Application Release Recovery, Service Stability & Margin Protection","description":"Recover a delayed software release while protecting live service quality, customer confidence and delivery economics.","bonus":false},{"href":"#ps2","number":"02","domain":"PRE-SALES · DIGITAL ENGINEERING","title":"Digital Product Modernization Pursuit: Win Strategy & Deal Economics","description":"Shape a competitive application-modernization proposal that a delivery team can actually execute.","bonus":false},{"href":"#ps3","number":"03","domain":"DELIVERY EXCELLENCE · ENGINEERING & OPERATIONS","title":"Software Quality, Engagement Health & Delivery Assurance","description":"Create practical leadership oversight across software engineering, application support and service delivery.","bonus":false},{"href":"#ps4","number":"04","domain":"CUSTOMER MANAGEMENT · PRODUCT & SERVICES","title":"Digital Customer Trust Recovery, Product Value & Renewal Growth","description":"Connect application outcomes and service reliability to a credible customer recovery and renewal strategy.","bonus":false},{"href":"#ps5","number":"05","domain":"DELIVERY MANAGEMENT · PORTFOLIO EXECUTION","title":"Multi-Program Delivery Predictability & Resource Prioritization","description":"Improve delivery reliability across competing customer programs by balancing capacity, dependencies, scope and commitments.","bonus":false},{"href":"#open","number":"06","domain":"OPEN INNOVATION","title":"Your Own Leadership Improvement Challenge","description":"Choose a leadership concern and outline a practical improvement using an approach of your choice.","bonus":true}],"cases":[{"id":"ps1","className":"case","ariaLabelledBy":"heading-ps1","heroHTML":"<div class=\"case-head\"><span class=\"case-idx\">PROBLEM STATEMENT 01</span><span class=\"pill\">DELIVERY MANAGEMENT · SOFTWARE &amp; SERVICES</span></div>\n<div class=\"case-titleline\"><span class=\"caseicon icon3d-mount\" data-icon=\"ps1\"></span><div><h2 id=\"heading-ps1\">Application Release Recovery, Service Stability &amp; Margin Protection</h2><p class=\"caselead\">Recover a delayed software release while protecting live service quality, customer confidence and delivery economics.</p></div></div>\n<p class=\"stakes\"><b>Leadership stakes</b>   Release commitments · production stability · contractual exposure · delivery margin</p>\n","contentHTML":"\n<div class=\"case-block\"><h3><span class=\"hicon\">01</span> Domain context &amp; business situation</h3><p>You lead a strategic account that develops a customer-facing application and also runs its production support. A major release is four weeks late, business users report recurring defects, and the support team is dealing with incidents triggered by recent changes. Product, engineering and operations leaders give different explanations for the delays. The customer expects a stable release before a high-volume business season and is questioning the value of the contract.</p><p>The account CFO wants to protect margin; the engineering lead asks for more testing time; operations wants a release freeze; and the customer sponsor expects a credible recovery date. You must decide what to stabilize, what to release, how to organize joint engineering-and-operations ownership, and what to communicate without promising an unproven date.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">02</span> Illustrative starting signals</h3><div class=\"metrics\"><div class=\"metric\"><span>Planned release</span><strong>4 weeks behind commitment</strong></div><div class=\"metric\"><span>Release predictability</span><strong>61% of planned stories completed on time</strong></div><div class=\"metric\"><span>Production incidents</span><strong>18 release-related incidents in 60 days</strong></div><div class=\"metric\"><span>Escaped defects</span><strong>9 high-severity defects found after release</strong></div><div class=\"metric\"><span>Delivery margin</span><strong>14% actual vs 20% plan</strong></div><div class=\"metric\"><span>Specialist capacity</span><strong>3 key engineers shared with support</strong></div></div><p class=\"micro\">All figures are illustrative exercise inputs. Use them as a starting point; make only the extra assumptions you need and label them clearly.</p></div>\n<div class=\"case-block tensions\"><h3><span class=\"hicon\">03</span> Competing pressures to resolve</h3><ul><li>A full release freeze may stabilize operations but delay a customer-visible feature that matters for the upcoming season.</li><li>Accelerating development without sufficient testing could create more customer incidents and costly rework.</li><li>Hiring additional specialists may improve capacity but could further reduce the account margin.</li></ul></div>\n<div class=\"requirement\"><span class=\"requirement-label\">TRANSFORMATION REQUIREMENT</span><p>Recommend a realistic recovery approach for both application delivery and live operations. Decide what should ship or pause, estimate the effort and customer impact, and identify the leadership decisions needed.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">04</span> Suggested approach — keep it practical</h3><ol><li>Identify the three biggest causes of release delay and production instability; distinguish facts from assumptions.</li><li>Recommend a workable release recovery plan, explaining how it protects quality, delivery commitments and live operations.</li><li>Create a 90-day plan linking engineering, testing, production support, customer checkpoints and success measures.</li></ol></div>\n<div class=\"case-block synthetic-evidence\"><h3><span class=\"hicon\">05</span> Suggested evidence — data that may be useful</h3><p class=\"ev-intro\">Teams may use <strong>any approved AI tool to generate synthetic data</strong> in a format they prefer (for example, a simple table, spreadsheet or document). The items below are suggestions, not mandatory datasets or separate deliverables. </p><p class=\"ev-data-boundary\">Evidence boundary: keep supplied starting figures unchanged; identify additional assumptions separately from AI-generated example data. Use synthetic records to illustrate or test a decision—not as proof of real-world results.</p><p class=\"ev-tip\"><strong>Where to start: </strong>Start with release dates and production issues. Add resource or financial information only if it helps your recommendation.</p><div class=\"ev-grid ev-needed-grid\"><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Release and delivery progress</div><ul class=\"ev-points\"><li>Planned versus actual release dates and key milestones.</li><li>Work committed versus work completed on time.</li><li>Testing readiness and important customer commitments.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Production incidents and defects</div><ul class=\"ev-points\"><li>Incidents after releases, including severity and customer impact.</li><li>Outstanding defects, resolution status and possible causes.</li><li>Duration of disruption or rework where relevant.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Team capacity and commercial impact</div><ul class=\"ev-points\"><li>Availability of critical engineering, testing and support skills.</li><li>Workload, effort overruns or additional recovery costs.</li><li>Expected versus actual delivery margin, if needed for the decision.</li></ul></article></div><div class=\"ev-guardrails\"><strong>Keep the information realistic: </strong><p>Keep the examples consistent with the case: about 61% on-time completion, one release four weeks late, release incidents and escaped defects, and 20% planned versus 14% actual margin.</p><p>Use invented names and references only. Keep dates and quantities consistent, include a few exceptions, and review AI-generated information before using it.</p></div><details class=\"ev-generator\"><summary>Optional prompt for generating synthetic data with any AI tool</summary><p>Create a small, realistic synthetic dataset for an application release recovery case. Include release progress, customer-impacting incidents, outstanding defects and optional team-capacity or cost information. Show both healthy and delayed work. Use invented names, varied dates and a few unresolved items. Keep the totals consistent with the case scenario. Present it as a simple table or in my preferred file format.</p><p class=\"ev-small\">Generating example data is optional. There is no requirement to build an AI solution, write code, or create a prototype.</p></details></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">06</span> Mandatory deliverables </h3><div class=\"outputs\"><div class=\"output\"><span class=\"out-num\">01.D1</span><div class=\"output-content\"><strong>Application Recovery Decision Brief</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>Summarize the release and production issues, likely causes, customer consequences and evidence still needed.</li><li>Recommend immediate containment and recovery actions; state release-readiness conditions, the approving owner and the decision criteria. Treat an unconfirmed release date as conditional on evidence.</li></ul></div></div><div class=\"output\"><span class=\"out-num\">01.D2</span><div class=\"output-content\"><strong>90-Day Release, Service &amp; Customer Confidence Plan</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>Plan 90 days of backlog prioritization, quality checks, conditional release approval, live monitoring and customer checkpoints, with named owners.</li><li>Include a concise customer update and 3–4 indicators such as release predictability, escaped defects, incidents and margin.</li></ul></div></div></div></div>\n<div class=\"case-block two-col\"><div><h3><span class=\"hicon\">07</span> Decision-quality checks</h3><ul><li>Do not treat a likely root cause as proven without evidence.</li><li>Balance delivery speed against testing and production risk.</li><li>Explain how the customer will recognize real improvement.</li><li>Do not promise a release date until readiness evidence and the approver are identified.</li></ul></div><div><h3><span class=\"hicon\">08</span> What good looks like</h3><p>The customer and account leadership can approve a recovery sequence that restores delivery confidence while protecting production quality and commercial viability.</p></div></div>\n","footHTML":"<a href=\"#choose\">↑ Back to problem statements</a><a href=\"#submit\">Submission guide ↗</a>","title":"Application Release Recovery, Service Stability & Margin Protection","index":1},{"id":"ps2","className":"case","ariaLabelledBy":"heading-ps2","heroHTML":"<div class=\"case-head\"><span class=\"case-idx\">PROBLEM STATEMENT 02</span><span class=\"pill\">PRE-SALES · DIGITAL ENGINEERING</span></div>\n<div class=\"case-titleline\"><span class=\"caseicon icon3d-mount\" data-icon=\"ps2\"></span><div><h2 id=\"heading-ps2\">Digital Product Modernization Pursuit: Win Strategy &amp; Deal Economics</h2><p class=\"caselead\">Shape a competitive application-modernization proposal that a delivery team can actually execute.</p></div></div>\n<p class=\"stakes\"><b>Leadership stakes</b>   Client value · bid competitiveness · engineering capability · delivery risk</p>\n","contentHTML":"\n<div class=\"case-block\"><h3><span class=\"hicon\">01</span> Domain context &amp; business situation</h3><p>A major retail enterprise has requested proposals to modernize its legacy customer and order-management applications. It wants a simpler user experience, faster feature delivery and secure integration with existing systems. The opportunity includes application design, modernization, testing, phased rollout and post-launch support. The incumbent provides limited system documentation, and business stakeholders disagree about which capabilities should move first.</p><p>Procurement favors a fixed-price, ambitious timeline; the CIO wants better maintainability and security; and business leaders expect visible improvements within six months. Sales wants to bid aggressively, but the engineering team fears underestimated legacy dependencies and unclear acceptance criteria. Your leadership group must decide whether to bid, what scope and commercial model to offer, and how to make delivery commitments credible.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">02</span> Illustrative starting signals</h3><div class=\"metrics\"><div class=\"metric\"><span>Opportunity size</span><strong>Illustrative USD 28M / 3 years</strong></div><div class=\"metric\"><span>Application estate</span><strong>14 applications, 45 important interfaces</strong></div><div class=\"metric\"><span>Modernization ambition</span><strong>First business release within 6 months</strong></div><div class=\"metric\"><span>Legacy documentation</span><strong>Only 55% of critical flows described</strong></div><div class=\"metric\"><span>Competitive pressure</span><strong>Alternative bid estimated 10% lower</strong></div><div class=\"metric\"><span>Margin expectation</span><strong>At least 18% steady-state target</strong></div></div><p class=\"micro\">All figures are illustrative exercise inputs. Use them as a starting point; make only the extra assumptions you need and label them clearly.</p></div>\n<div class=\"case-block tensions\"><h3><span class=\"hicon\">03</span> Competing pressures to resolve</h3><ul><li>A fixed-price commitment appeals to procurement but could expose the provider to poorly understood legacy-system risks.</li><li>Modernizing everything at once may reduce long-term complexity but delay the first visible business result.</li><li>Aggressive staffing and delivery assumptions could win the bid yet undermine quality, security or margin.</li></ul></div>\n<div class=\"requirement\"><span class=\"requirement-label\">TRANSFORMATION REQUIREMENT</span><p>Recommend a bid/no-bid position and a credible digital-product modernization offer. Define the proposed scope and delivery approach, outline indicative commercials, and decide which customer assumptions must be validated before signing.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">04</span> Suggested approach — keep it practical</h3><ol><li>Clarify the three most important business outcomes and the largest application dependencies.</li><li>Outline a practical modernization proposal with a realistic release scope, indicative price and key delivery risks.</li><li>Recommend a commercial position, first-release boundary, delivery ownership and negotiation guardrails.</li></ol></div>\n<div class=\"case-block synthetic-evidence\"><h3><span class=\"hicon\">05</span> Suggested evidence — data that may be useful</h3><p class=\"ev-intro\">Teams may use <strong>any approved AI tool to generate synthetic data</strong> in a format they prefer (for example, a simple table, spreadsheet or document). The items below are suggestions, not mandatory datasets or separate deliverables. </p><p class=\"ev-data-boundary\">Evidence boundary: keep supplied starting figures unchanged; identify additional assumptions separately from AI-generated example data. Use synthetic records to illustrate or test a decision—not as proof of real-world results.</p><p class=\"ev-tip\"><strong>Where to start: </strong>Start with the application landscape and business priorities. Add commercial information to support your recommended proposal.</p><div class=\"ev-grid ev-needed-grid\"><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Application landscape</div><ul class=\"ev-points\"><li>Applications and the business functions they support.</li><li>Dependencies and interfaces between important applications.</li><li>Documentation gaps, security concerns and modernization readiness.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Business priorities and delivery scope</div><ul class=\"ev-points\"><li>Requested features or capabilities and expected business benefits.</li><li>Priority, relative effort and dependencies for each proposed change.</li><li>Possible release phases and customer acceptance expectations.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Proposal and commercial considerations</div><ul class=\"ev-points\"><li>Alternative delivery approaches with indicative cost and timelines.</li><li>Key assumptions, major risks and expected commercial outcomes.</li><li>Customer budget, competitor benchmark and first-release expectation.</li></ul></article></div><div class=\"ev-guardrails\"><strong>Keep the information realistic: </strong><p>Reflect the scenario of 14 applications, 45 interfaces, roughly 55% documented critical flows, a USD 28M opportunity and a first business release within six months.</p><p>Use invented names and references only. Keep dates and quantities consistent, include a few exceptions, and review AI-generated information before using it.</p></div><details class=\"ev-generator\"><summary>Optional prompt for generating synthetic data with any AI tool</summary><p>Create realistic synthetic inputs for a digital-product modernization pursuit: an application landscape, customer-requested capabilities, dependencies, delivery options and indicative commercial assumptions. Include uncertainty and some documentation gaps. Keep the scenario numbers consistent, use invented names and make the results easy to review as tables or another format I choose.</p><p class=\"ev-small\">Generating example data is optional. There is no requirement to build an AI solution, write code, or create a prototype.</p></details></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">06</span> Mandatory deliverables </h3><div class=\"outputs\"><div class=\"output\"><span class=\"out-num\">02.D1</span><div class=\"output-content\"><strong>Bid Decision &amp; Commercial Value Brief</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>State a bid or no-bid decision, the customer value proposition, and the rationale behind the recommended position; multiple offer options are not required.</li><li>If bidding, show simple price, effort and margin estimates with assumptions and approvals. If not bidding, explain the commercial and delivery barriers and what would change the decision.</li></ul></div></div><div class=\"output\"><span class=\"out-num\">02.D2</span><div class=\"output-content\"><strong>Client Response &amp; Delivery Readiness Plan</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>If bidding, outline a phased development and rollout roadmap with owners. If not bidding, prepare a credible customer response, clarifications needed and conditions for reconsideration.</li><li>For either decision, identify key security, integration, testing, support and contracting safeguards and the next decision checkpoint.</li></ul></div></div></div></div>\n<div class=\"case-block two-col\"><div><h3><span class=\"hicon\">07</span> Decision-quality checks</h3><ul><li>Do not promise a delivery date without defining scope and dependencies.</li><li>Make the financial assumptions consistent with engineering capacity.</li><li>Explain how new features will be released without disrupting existing users.</li></ul></div><div><h3><span class=\"hicon\">08</span> What good looks like</h3><p>Sales and delivery leaders have an attractive but executable proposal with clear release boundaries, commercial safeguards and customer outcomes.</p></div></div>\n","footHTML":"<a href=\"#choose\">↑ Back to problem statements</a><a href=\"#submit\">Submission guide ↗</a>","title":"Digital Product Modernization Pursuit: Win Strategy & Deal Economics","index":2},{"id":"ps3","className":"case","ariaLabelledBy":"heading-ps3","heroHTML":"<div class=\"case-head\"><span class=\"case-idx\">PROBLEM STATEMENT 03</span><span class=\"pill\">DELIVERY EXCELLENCE · ENGINEERING &amp; OPERATIONS</span></div>\n<div class=\"case-titleline\"><span class=\"caseicon icon3d-mount\" data-icon=\"ps3\"></span><div><h2 id=\"heading-ps3\">Software Quality, Engagement Health &amp; Delivery Assurance</h2><p class=\"caselead\">Create practical leadership oversight across software engineering, application support and service delivery.</p></div></div>\n<p class=\"stakes\"><b>Leadership stakes</b>   Defect prevention · delivery predictability · audit readiness · customer outcomes</p>\n","contentHTML":"\n<div class=\"case-block\"><h3><span class=\"hicon\">01</span> Domain context &amp; business situation</h3><p>A delivery-excellence function provides independent assurance for 28 client engagements, including software product engineering, application modernization and IT operations. Reporting is spread across sprint summaries, release quality checks, service dashboards, audit evidence, risk registers and customer feedback. Some engineering teams repeatedly miss release goals while others meet service targets but experience customer complaints. Leadership reviews consume time without giving a clear early warning of problems.</p><p>Delivery leaders want an objective, fair scorecard; auditors need traceable evidence; and engineering managers fear that too many measures will create reporting work rather than better quality. Your team must recommend a small set of meaningful indicators and a simple improvement routine that covers both software quality and operational reliability.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">02</span> Illustrative starting signals</h3><div class=\"metrics\"><div class=\"metric\"><span>Engagements in scope</span><strong>28 across 5 business units</strong></div><div class=\"metric\"><span>Portfolio health</span><strong>4 red / 9 amber / 15 green</strong></div><div class=\"metric\"><span>Repeat quality findings</span><strong>22% recur in later reviews</strong></div><div class=\"metric\"><span>Actions overdue</span><strong>31% beyond committed dates</strong></div><div class=\"metric\"><span>Release quality evidence</span><strong>64% of sampled releases fully traceable</strong></div><div class=\"metric\"><span>Governance effort</span><strong>240 person-hours per month</strong></div></div><p class=\"micro\">All figures are illustrative exercise inputs. Use them as a starting point; make only the extra assumptions you need and label them clearly.</p></div>\n<div class=\"case-block tensions\"><h3><span class=\"hicon\">03</span> Competing pressures to resolve</h3><ul><li>An application team appears green on milestones but has high defect leakage after releases.</li><li>A service-support team is marked amber for incomplete evidence despite stable customer outcomes.</li><li>A customer audit is due soon, so reported controls must be evidence-backed rather than assumed.</li></ul></div>\n<div class=\"requirement\"><span class=\"requirement-label\">TRANSFORMATION REQUIREMENT</span><p>Recommend a simpler approach to assure engineering and service engagements. Select a few indicators that highlight release quality, delivery health and customer impact; define how leaders will act on issues and improve the process over 90 days.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">04</span> Suggested approach — keep it practical</h3><ol><li>Choose five or six measures across delivery predictability, defects, production stability, actions and customer feedback.</li><li>Show how to distinguish a genuine delivery problem from incomplete or inaccurate reporting.</li><li>Define a light review-and-escalation process and a 90-day pilot across one engineering team and one service team.</li></ol></div>\n<div class=\"case-block synthetic-evidence\"><h3><span class=\"hicon\">05</span> Suggested evidence — data that may be useful</h3><p class=\"ev-intro\">Teams may use <strong>any approved AI tool to generate synthetic data</strong> in a format they prefer (for example, a simple table, spreadsheet or document). The items below are suggestions, not mandatory datasets or separate deliverables. </p><p class=\"ev-data-boundary\">Evidence boundary: keep supplied starting figures unchanged; identify additional assumptions separately from AI-generated example data. Use synthetic records to illustrate or test a decision—not as proof of real-world results.</p><p class=\"ev-tip\"><strong>Where to start: </strong>Start with engagement performance and audit observations. Add release-quality evidence only if needed to test an assurance recommendation.</p><div class=\"ev-grid ev-needed-grid\"><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Engagement health and performance</div><ul class=\"ev-points\"><li>Engagement type, service or product scope and overall health status.</li><li>Delivery KPIs, missed commitments, customer concerns and trends.</li><li>Time spent preparing governance reviews or reports.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Quality observations and corrective actions</div><ul class=\"ev-points\"><li>Defects, recurring issues, audit observations and possible root causes.</li><li>Actions agreed, accountable owners, due dates and closure status.</li><li>Items overdue, repeated or awaiting evidence.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Release and compliance evidence</div><ul class=\"ev-points\"><li>Key release approvals, testing evidence and change records.</li><li>Evidence available versus missing for selected engagements.</li><li>Important operational or quality control exceptions.</li></ul></article></div><div class=\"ev-guardrails\"><strong>Keep the information realistic: </strong><p>Keep the exercise assumptions recognizable: 28 engagements (4 red, 9 amber, 15 green), repeated findings, overdue actions and incomplete evidence for some releases.</p><p>Use invented names and references only. Keep dates and quantities consistent, include a few exceptions, and review AI-generated information before using it.</p></div><details class=\"ev-generator\"><summary>Optional prompt for generating synthetic data with any AI tool</summary><p>Generate simple synthetic data for delivery assurance across software engineering and IT service engagements. Include engagement health, selected quality findings, action owners and overdue items, plus gaps in release or compliance evidence. Use mixed outcomes and invented identifiers. Align the figures with the case and provide the result in any convenient file or table format.</p><p class=\"ev-small\">Generating example data is optional. There is no requirement to build an AI solution, write code, or create a prototype.</p></details></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">06</span> Mandatory deliverables </h3><div class=\"outputs\"><div class=\"output\"><span class=\"out-num\">03.D1</span><div class=\"output-content\"><strong>Engineering &amp; Service Assurance Decision Brief</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>Create one simple portfolio-health view covering release quality, service stability and top risks. Explain the basis for each red/amber/green rating; show insufficient evidence as unknown, not automatically red.</li><li>Identify priority interventions, missing evidence, owners and the decisions leaders should make.</li></ul></div></div><div class=\"output\"><span class=\"out-num\">03.D2</span><div class=\"output-content\"><strong>Governance Improvement &amp; 90-Day Pilot Plan</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>Describe the review, escalation and action-closure workflow with clear ownership and checkpoints.</li><li>Plan a small pilot for engineering and service engagements, with benefits, 3–4 measures and basic safeguards.</li></ul></div></div></div></div>\n<div class=\"case-block two-col\"><div><h3><span class=\"hicon\">07</span> Decision-quality checks</h3><ul><li>Release quality and service stability should both be represented.</li><li>Missing evidence is not proof of poor performance.</li><li>Every serious risk must have a responsible owner and a follow-up date.</li><li>Define simple, consistent criteria for portfolio-health ratings and distinguish verified risks from missing evidence.</li></ul></div><div><h3><span class=\"hicon\">08</span> What good looks like</h3><p>Leadership can spot weak software releases or operational issues sooner, make fair interventions and reduce reporting effort without compromising governance.</p></div></div>\n","footHTML":"<a href=\"#choose\">↑ Back to problem statements</a><a href=\"#submit\">Submission guide ↗</a>","title":"Software Quality, Engagement Health & Delivery Assurance","index":3},{"id":"ps4","className":"case","ariaLabelledBy":"heading-ps4","heroHTML":"<div class=\"case-head\"><span class=\"case-idx\">PROBLEM STATEMENT 04</span><span class=\"pill\">CUSTOMER MANAGEMENT · PRODUCT &amp; SERVICES</span></div>\n<div class=\"case-titleline\"><span class=\"caseicon icon3d-mount\" data-icon=\"ps4\"></span><div><h2 id=\"heading-ps4\">Digital Customer Trust Recovery, Product Value &amp; Renewal Growth</h2><p class=\"caselead\">Connect application outcomes and service reliability to a credible customer recovery and renewal strategy.</p></div></div>\n<p class=\"stakes\"><b>Leadership stakes</b>   Customer advocacy · product adoption · value proof · renewal confidence</p>\n","contentHTML":"\n<div class=\"case-block\"><h3><span class=\"hicon\">01</span> Domain context &amp; business situation</h3><p>A strategic customer has expanded its relationship over five years to include a customer-facing digital platform, enhancement releases and managed support. Contractual support measures are mostly green, yet users complain about slow feature improvements, intermittent checkout problems and poor communication about defects. A new CIO has joined; a competitor has proposed a digital refresh; and renewal is nine months away.</p><p>Account leadership wants to start a new transformation sales conversation, while customer-success and engineering leads argue that adoption and product quality must improve first. Delivery capacity is limited and several previously promised benefits were never measured. Your team must decide how to rebuild trust, establish evidence of business value and sequence a responsible renewal or expansion discussion.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">02</span> Illustrative starting signals</h3><div class=\"metrics\"><div class=\"metric\"><span>Annual account revenue</span><strong>Illustrative USD 24M</strong></div><div class=\"metric\"><span>Renewal horizon</span><strong>9 months</strong></div><div class=\"metric\"><span>Customer advocacy</span><strong>48 / 100 vs 70 target</strong></div><div class=\"metric\"><span>Priority product defects</span><strong>11 unresolved user-facing issues</strong></div><div class=\"metric\"><span>Value outcomes verified</span><strong>Only 4 of 12 claims evidenced</strong></div><div class=\"metric\"><span>Potential growth</span><strong>USD 7M pipeline, uncertain qualification</strong></div></div><p class=\"micro\">All figures are illustrative exercise inputs. Use them as a starting point; make only the extra assumptions you need and label them clearly.</p></div>\n<div class=\"case-block tensions\"><h3><span class=\"hicon\">03</span> Competing pressures to resolve</h3><ul><li>Support SLAs are mostly met, but the digital customer journey still suffers from recurring failures.</li><li>The customer disputes productivity and conversion improvements that lack agreed measurements.</li><li>A proposed expansion would use engineers already needed to resolve current product defects.</li></ul></div>\n<div class=\"requirement\"><span class=\"requirement-label\">TRANSFORMATION REQUIREMENT</span><p>Recommend a customer recovery and renewal approach that addresses digital-product quality and ongoing service outcomes. Recommend a sensible relationship strategy, prioritize evidence-backed improvements, and plan when to discuss new business.</p></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">04</span> Suggested approach — keep it practical</h3><ol><li>Prepare a short account-health picture combining customer feedback, product issues, service outcomes and promised value.</li><li>Recommend a customer recovery strategy that balances service quality, trust and growth opportunities, including staffing implications.</li><li>Set a 90-day joint customer plan with clear ownership, verified outcome measures and a few executive talking points.</li></ol></div>\n<div class=\"case-block synthetic-evidence\"><h3><span class=\"hicon\">05</span> Suggested evidence — data that may be useful</h3><p class=\"ev-intro\">Teams may use <strong>any approved AI tool to generate synthetic data</strong> in a format they prefer (for example, a simple table, spreadsheet or document). The items below are suggestions, not mandatory datasets or separate deliverables. </p><p class=\"ev-data-boundary\">Evidence boundary: keep supplied starting figures unchanged; identify additional assumptions separately from AI-generated example data. Use synthetic records to illustrate or test a decision—not as proof of real-world results.</p><p class=\"ev-tip\"><strong>Where to start: </strong>Start with customer feedback and product issues. Add promised-value and account trends to support the renewal recommendation.</p><div class=\"ev-grid ev-needed-grid\"><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Customer feedback and product issues</div><ul class=\"ev-points\"><li>Customer complaints, service feedback and user-facing product defects.</li><li>Issue priority, age, current status and affected users.</li><li>Customer expectations and recurring concerns.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Promised versus delivered business value</div><ul class=\"ev-points\"><li>Benefits or outcomes promised to the customer.</li><li>Observed results and whether supporting evidence is available.</li><li>Gaps between claims and measurable customer value.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Account health and relationship</div><ul class=\"ev-points\"><li>Customer satisfaction and adoption trends over time.</li><li>Upcoming renewal milestones and key stakeholder concerns.</li><li>Account revenue, growth opportunities and confidence in the pipeline.</li></ul></article></div><div class=\"ev-guardrails\"><strong>Keep the information realistic: </strong><p>Retain the core scenario signals: 11 unresolved product defects, only 4 of 12 value claims verified, advocacy below target and renewal nine months away.</p><p>Use invented names and references only. Keep dates and quantities consistent, include a few exceptions, and review AI-generated information before using it.</p></div><details class=\"ev-generator\"><summary>Optional prompt for generating synthetic data with any AI tool</summary><p>Create realistic synthetic customer-account data covering product defects, customer feedback, promised business benefits, actual results and account-health trends. Include both positive and negative observations, with some claims lacking proof. Use fictitious customer and stakeholder names, preserve the case assumptions, and format the output as a simple dataset of my choice.</p><p class=\"ev-small\">Generating example data is optional. There is no requirement to build an AI solution, write code, or create a prototype.</p></details></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">06</span> Mandatory deliverables </h3><div class=\"outputs\"><div class=\"output\"><span class=\"out-num\">04.D1</span><div class=\"output-content\"><strong>Customer Recovery &amp; Renewal Decision Brief</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>Summarize the customer’s main concerns, important product defects, service gaps and unproven value commitments.</li><li>Present your recommended account approach and explain delivery capacity, relationship risk and renewal impact.</li></ul></div></div><div class=\"output\"><span class=\"out-num\">04.D2</span><div class=\"output-content\"><strong>Executive Customer Engagement &amp; 90-Day Plan</strong><p class=\"deliverable-hint\">Include both points in this single output; no additional file is required.</p><ul class=\"deliverable-includes\"><li>Link each important product, service and customer-value commitment to a named owner, checkpoint and evidence the customer will see. Separate proposed improvements from benefits already verified.</li><li>Draft a concise steering-committee message stating the commitments, when progress will be reviewed, and the evidence the customer can use to verify them.</li></ul></div></div></div></div>\n<div class=\"case-block two-col\"><div><h3><span class=\"hicon\">07</span> Decision-quality checks</h3><ul><li>Customer value claims need evidence or must be labelled as estimates.</li><li>Do not sell additional work that removes critical staff from recovery.</li><li>Track both product usability and support reliability.</li></ul></div><div><h3><span class=\"hicon\">08</span> What good looks like</h3><p>The customer sees visible progress in digital-product quality and service outcomes before being asked to consider renewal or expansion.</p></div></div>\n","footHTML":"<a href=\"#choose\">↑ Back to problem statements</a><a href=\"#submit\">Submission guide ↗</a>","title":"Digital Customer Trust Recovery, Product Value & Renewal Growth","index":4},{"id":"ps5","className":"case","ariaLabelledBy":"heading-ps5","heroHTML":"\n<div class=\"case-head\"><span class=\"case-idx\">PROBLEM STATEMENT 05</span><span class=\"pill\">DELIVERY MANAGEMENT · PORTFOLIO EXECUTION</span></div>\n<div class=\"case-titleline\"><span class=\"caseicon icon3d-mount\" data-icon=\"ps5\"></span><div>\n<h2 id=\"heading-ps5\">Multi-Program Delivery Predictability &amp; Resource Prioritization</h2>\n<p class=\"caselead\">Improve delivery reliability across competing customer programs by balancing capacity, dependencies, scope and commitments.</p>\n</div></div>\n<p class=\"stakes\"><b>Leadership stakes</b> Customer commitments · shared-team capacity · delivery predictability · account profitability</p>\n","contentHTML":"\n<div class=\"case-block\"><h3><span class=\"hicon\">01</span> Domain context &amp; business situation</h3>\n<p>You oversee a delivery portfolio spanning five application development and support programs for three enterprise customers. Several programs have overlapping delivery dates, and a small group of architects, testers and specialist engineers is shared across teams. Project leads report progress differently, dependencies are discovered late, and change requests are accepted before their delivery impact is agreed. Even though most teams appear busy, customer milestones keep slipping.</p>\n<p>One customer needs a new digital capability before its business launch, another expects an agreed modernization milestone, and a third requires stable support throughout a seasonal peak. Adding contractors may improve short-term capacity but reduce margin; moving shared specialists may help one customer while delaying another. Your leadership team must set clear priorities, choose a realistic capacity plan and restore confidence in delivery commitments.</p>\n</div>\n<div class=\"case-block\"><h3><span class=\"hicon\">02</span> Illustrative starting signals</h3>\n<div class=\"metrics\">\n<div class=\"metric\"><span>Portfolio size</span><strong>5 programs across 3 customers</strong></div>\n<div class=\"metric\"><span>Milestones delivered on time</span><strong>71% over the last 8 weeks</strong></div>\n<div class=\"metric\"><span>Cross-team dependencies</span><strong>17 open · 6 past due</strong></div>\n<div class=\"metric\"><span>Shared specialist capacity</span><strong>2 key roles allocated at 125%</strong></div>\n<div class=\"metric\"><span>Pending scope decisions</span><strong>14 change requests awaiting impact review</strong></div>\n<div class=\"metric\"><span>Portfolio delivery margin</span><strong>17% actual vs 22% plan</strong></div>\n</div>\n<p class=\"micro\">All figures are illustrative exercise inputs. Additional assumptions are permitted if clearly labelled; external research is optional.</p>\n</div>\n<div class=\"case-block tensions\"><h3><span class=\"hicon\">03</span> Competing pressures to resolve</h3>\n<ul>\n<li>All three customers see their deadlines as urgent, but key specialists cannot support every milestone at once.</li>\n<li>Buying extra capacity could protect dates but increase cost; reprioritizing work could require difficult customer conversations.</li>\n<li>New scope is arriving faster than teams can assess it, while live support and quality checks must continue.</li>\n</ul>\n</div>\n<div class=\"requirement\"><span class=\"requirement-label\">TRANSFORMATION REQUIREMENT</span>\n<p>Recommend a practical portfolio-delivery reset. Prioritize critical milestones, review customer commitments and decide where targeted capacity or team reallocation is needed. Show how the decision would improve delivery predictability, protect important customer outcomes and keep costs under control. No prototype, coding or technical architecture is needed.</p>\n</div>\n<div class=\"case-block\"><h3><span class=\"hicon\">04</span> Suggested approach — keep it practical</h3>\n<ol>\n<li>Identify the two most important delivery bottlenecks using the six starting signals.</li>\n<li>Explain how the proposed delivery priorities address customer impact, available capacity, cost and feasibility.</li>\n<li>Choose priority milestones and outline a simple 90-day recovery routine with owners and customer updates.</li>\n</ol>\n</div>\n<div class=\"case-block synthetic-evidence\"><h3><span class=\"hicon\">05</span> Suggested evidence — data that may be useful</h3><p class=\"ev-intro\">Teams may use <strong>any approved AI tool to generate synthetic data</strong> in a format they prefer (for example, a simple table, spreadsheet or document). The items below are suggestions, not mandatory datasets or separate deliverables. </p><p class=\"ev-data-boundary\">Evidence boundary: keep supplied starting figures unchanged; identify additional assumptions separately from AI-generated example data. Use synthetic records to illustrate or test a decision—not as proof of real-world results.</p><p class=\"ev-tip\"><strong>Where to start: </strong>Start with program milestones and delivery dependencies. Add staffing and change-request information to test trade-offs.</p><div class=\"ev-grid ev-needed-grid\"><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Program commitments and milestones</div><ul class=\"ev-points\"><li>Programs, customers, key milestones and promised completion dates.</li><li>Actual or forecast delivery dates and business impact of delays.</li><li>Program priority and delivery status.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Cross-team dependencies</div><ul class=\"ev-points\"><li>Dependencies between programs and the teams involved.</li><li>Expected completion dates, owners and whether dependencies are blocked.</li><li>Effects of overdue dependencies on customer commitments.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Specialist availability</div><ul class=\"ev-points\"><li>Critical skills needed and available team capacity.</li><li>How shared specialists are allocated across programs.</li><li>Overloaded roles and possible resourcing alternatives.</li></ul></article><article class=\"ev-card ev-needed-card\"><div class=\"ev-needed-title\">Scope changes and financial impact</div><ul class=\"ev-points\"><li>Customer change requests, priority and pending approvals.</li><li>Indicative effort, schedule and cost impact.</li><li>Planned versus actual portfolio margin, if useful.</li></ul></article></div><div class=\"ev-guardrails\"><strong>Keep the information realistic: </strong><p>Keep the five-program scenario credible: about 71% on-time milestones, 17 open dependencies (6 overdue), 14 pending changes and two overallocated specialists.</p><p>Use invented names and references only. Keep dates and quantities consistent, include a few exceptions, and review AI-generated information before using it.</p></div><details class=\"ev-generator\"><summary>Optional prompt for generating synthetic data with any AI tool</summary><p>Create small synthetic datasets for a portfolio of five customer programs. Include commitments, milestones, cross-team dependencies, shared specialists and pending scope changes. Show realistic conflicts and a few missing estimates. Use invented customer and program details, stay consistent with the case starting numbers, and provide it in my preferred table or file format.</p><p class=\"ev-small\">Generating example data is optional. There is no requirement to build an AI solution, write code, or create a prototype.</p></details></div>\n<div class=\"case-block\"><h3><span class=\"hicon\">06</span> Mandatory deliverables </h3>\n<div class=\"outputs\">\n<div class=\"output\"><span class=\"out-num\">05.D1</span><div class=\"output-content\">\n<strong>Portfolio Delivery Decision Brief</strong>\n<p class=\"deliverable-hint\">One concise leadership decision brief; a complex financial model is not needed.</p>\n<ul class=\"deliverable-includes\">\n<li>Describe where milestones are slipping, which resources or dependencies are constrained, and the customer impact.</li>\n<li>Recommend delivery priorities and show a simple before-and-after view of specialist allocation, including which customer commitments improve, move or remain at risk. Keep resource and margin assumptions feasible.</li>\n</ul>\n</div></div>\n<div class=\"output\"><span class=\"out-num\">05.D2</span><div class=\"output-content\">\n<strong>90-Day Delivery Recovery &amp; Customer Commitment Plan</strong>\n<p class=\"deliverable-hint\">One practical action plan; no prototype, code or formal architecture is required.</p>\n<ul class=\"deliverable-includes\">\n<li>Sequence actions across the next 90 days with owners, milestone checkpoints and customer communication.</li>\n<li>Track 3–4 measures such as milestone reliability, overdue dependencies, specialist overload and margin recovery; include key safeguards.</li>\n</ul>\n</div></div>\n</div>\n</div>\n<div class=\"case-block two-col\">\n<div><h3><span class=\"hicon\">07</span> Decision-quality checks</h3><ul>\n<li>Be explicit about what is prioritized, deferred and communicated to each customer.</li>\n<li>Avoid assuming overloaded specialists can simply work more hours or that new hires become productive immediately.</li>\n<li>Keep quality and live-service commitments protected during the delivery reset.</li>\n</ul></div>\n<div><h3><span class=\"hicon\">08</span> What good looks like</h3>\n<p>A delivery sponsor can approve clear priorities, realistic resource choices and a 90-day plan that improves milestone reliability without hiding cost, customer or quality trade-offs.</p>\n\n</div>\n</div>\n","footHTML":"<a href=\"#choose\">↑ Back to problem statements</a><a href=\"#submit\">Submission guide ↗</a>","title":"Multi-Program Delivery Predictability & Resource Prioritization","index":5},{"id":"open","className":"case bonus","ariaLabelledBy":"heading-open","heroHTML":"<div class=\"case-head\"><span class=\"case-idx\">OPEN-ENDED PROBLEM STATEMENT 06</span><span class=\"pill\">OPEN INNOVATION</span></div>\n<div class=\"case-titleline\"><span class=\"caseicon icon3d-mount\" data-icon=\"open\"></span><div><h2 id=\"heading-open\">Your Own Leadership Improvement Challenge</h2><p class=\"caselead\">Choose a meaningful leadership problem and recommend a practical improvement. Any suitable process or technology approach is welcome.</p></div></div>","contentHTML":"<div class=\"case-block\"><h3>Domain context</h3><p>Choose a distinct software engineering, product delivery, customer, commercial, operations or leadership problem that does not repeat your PS 01–05 recommendations. Use illustrative information and clearly labelled assumptions. Use approved AI tools actively to develop and check the recommendation; the proposed business improvement itself need not be AI-based. Keep the scope achievable and explain who benefits, what changes and how value will be measured. A process change, governance practice, analytics concept, automation or other solution is acceptable.</p><p>Keep the scope achievable. Explain the problem, who benefits, what could change, and how leaders would know if the change works. A process change, new governance practice, dashboard concept, automation or other solution is equally acceptable.</p></div>\n<div class=\"case-block\"><h3>Possible challenge prompts</h3><ul><li>Which recurring leadership decision would improve with clearer evidence?</li><li>Which handoff or service issue causes repeated customer or operational frustration?</li><li>What simple improvement could your team test in 90 days?</li></ul></div>\n<div class=\"requirement\"><span class=\"requirement-label\">TRANSFORMATION REQUIREMENT</span><p>Propose one worthwhile leadership improvement. Explain the current problem, recommend a practical approach, and show a realistic 90-day starting plan. A prototype, technical design or AI-based solution is not required.</p></div>\n<div class=\"case-block\"><h3>Team-selected deliverables</h3><div class=\"open-deliverables-guide\" role=\"note\">\n<p class=\"open-deliverables-lead\"><strong>Your team decides the deliverables for PS 06.</strong> There is no fixed format, template, or number of deliverables. Select what best communicates the leadership problem and your proposed improvement.</p>\n<p><strong>Possible formats—examples only:</strong> a leadership decision note, process or governance redesign, improvement roadmap, customer communication plan, business-value summary, simple visual, or another format suitable for your chosen challenge. Use one or several, as genuinely useful.</p>\n<p><strong>Make your submission clear:</strong> explain the problem and who benefits, your recommended action, key assumptions and risks, who owns next steps, how success will be assessed, and how the team used AI to develop and check its work.</p>\n<p class=\"open-deliverables-bottom\"> PS 06 retains its <strong>30 bonus marks</strong>; the team is assessed on the relevance and quality of its solution, not a prescribed output format.</p>\n</div></div>\n<div class=\"case-block\"><h3>Decision-quality checks</h3><p>Keep the proposal focused on one important, original problem—not a rewording of any PS 01–05 solution. Show who owns the decision, what could go wrong, and how the team will verify value.</p></div>","footHTML":"<a href=\"#choose\">↑ Back to problem statements</a><a href=\"#submit\">Submission guide ↗</a>","title":"Your Own Leadership Improvement Challenge","index":6}],"nav":[{"heading":"START HERE","links":[{"href":"#submit","label":"Final team submission"},{"href":"#objectives","label":"Overview & objectives"},{"href":"#rules","label":"Working principles"},{"href":"#scoring","label":"Scoring & bonus marks"},{"href":"#choose","label":"Explore problem statements"}]},{
